name: Build VidGen IPA

on:
  push:
    branches:
      - "claude/ios-video-collage-app-E5LpS"
      - main
  workflow_dispatch:   # allows triggering manually from the GitHub UI

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15  # Xcode 16 pre-installed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, device slice)
        run: |
          xcodebuild \
            -project VidGen.xcodeproj \
            -scheme VidGen \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            clean build

      - name: Package into .ipa
        run: |
          APP="DerivedData/Build/Products/Release-iphoneos/VidGen.app"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r VidGen.ipa Payload/
          rm -rf Payload
          echo "IPA size: $(du -sh VidGen.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          # Artifact name includes branch + short SHA for traceability
          name: VidGen-${{ github.ref_name }}-${{ github.sha }}
          path: VidGen.ipa
          retention-days: 30
