name: VidGen
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  VidGen:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/VidGen
        createIntermediateGroups: true
    resources:
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: VidGen
        CFBundleName: VidGen
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        NSPhotoLibraryUsageDescription: "VidGen needs access to your photos and videos to create your collage."
        NSPhotoLibraryAddUsageDescription: "VidGen needs permission to save your video to Photos."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          OTHER_SWIFT_FLAGS: "-DDEBUG"
        release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: "-O"
